name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

defaults:
  run:
    working-directory: morphe-patches

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: morphe-patches/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: Quetta Privacy Patches ${{ steps.release.outputs.new_release_git_tag }}
          subject-path: morphe-patches/patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        run: ./gradlew :patches:buildAndroid clean --no-daemon
